<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetFlow</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="toast-container"></div>

    <div class="app-shell">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo-icon">🚛</div>
          <div class="sidebar-logo-text">
            <h2>FleetFlow</h2>
            <span id="role-label">Fleet Management</span>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- Injected by role -->
        </nav>
        <div class="sidebar-footer">
          <div class="user-badge">
            <div class="user-avatar" id="user-avatar">?</div>
            <div class="user-info">
              <div class="user-name" id="user-name">Loading...</div>
              <div class="user-role" id="user-role">—</div>
            </div>
            <button class="logout-btn" onclick="handleLogout()" title="Logout">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                style="width: 17px; height: 17px"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"
                />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <div class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <div class="topbar-title" id="topbar-title">Dashboard</div>
            <div class="topbar-subtitle" id="topbar-subtitle">Loading...</div>
          </div>
          <div class="topbar-right">
            <div class="role-badge" id="role-badge"></div>
            <div class="theme-toggle">
              <button
                class="theme-btn active"
                data-theme="dark"
                onclick="applyTheme('dark')"
              >
                🌙
              </button>
              <button
                class="theme-btn"
                data-theme="light"
                onclick="applyTheme('light')"
              >
                ☀️
              </button>
            </div>
            <button
              class="btn btn-sm btn-secondary"
              onclick="navigate(currentPage)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                style="width: 15px; height: 15px"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
                />
              </svg>
            </button>
          </div>
        </header>
        <main class="page-content">
          <div class="loading-overlay">
            <div class="spinner"></div>
            Loading...
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      (async function init() {
        applyTheme(localStorage.getItem("ff_theme") || "dark");
        const saved = localStorage.getItem("ff_user");
        if (!saved) {
          window.location.href = "index.html";
          return;
        }
        state.user = JSON.parse(saved);

        // Verify session still valid
        const { ok } = await api.auth.me();
        if (!ok) {
          localStorage.removeItem("ff_user");
          window.location.href = "index.html";
          return;
        }

        setupRoleUI(state.user.role);
        document.getElementById("user-name").textContent = state.user.name;
        document.getElementById("user-role").textContent =
          state.user.role.replace(/_/g, " ");
        document.getElementById("user-avatar").textContent =
          state.user.name[0].toUpperCase();
      })();

      async function handleLogout() {
        await api.auth.logout();
        localStorage.removeItem("ff_user");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
