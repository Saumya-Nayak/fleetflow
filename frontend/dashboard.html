      <!-- MAIN CONTENT -->
      <div class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <div class="topbar-title" id="topbar-title">Command Center</div>
            <div class="topbar-subtitle" id="topbar-subtitle">
              Real-time fleet overview
            </div>
          </div>
          <div class="topbar-right">
            <!-- Theme Toggle -->
            <div class="theme-toggle" title="Toggle theme">
              <button
                class="theme-btn active"
                data-theme="dark"
                onclick="applyTheme('dark')"
              >
                🌙
              </button>
              <button
                class="theme-btn"
                data-theme="light"
                onclick="applyTheme('light')"
              >
                ☀️
              </button>
            </div>
            <!-- Refresh -->
            <button
              class="btn btn-sm btn-secondary"
              onclick="navigate(currentPage)"
              title="Refresh"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                style="width: 16px; height: 16px"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
                />

            </button>
          </div>
        </header>

        <main class="page-content">
          <div class="loading-overlay">
            <div class="spinner"></div>
            Loading FleetFlow...
          </div>
        </main>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Init
      (async function init() {
        // Apply saved theme
        applyTheme(localStorage.getItem("ff_theme") || "dark");

        // Load user from localStorage or server
        const saved = localStorage.getItem("ff_user");
        if (saved) {
          state.user = JSON.parse(saved);
        } else {
          const { ok, data } = await api.auth.me();
          if (!ok) {
            window.location.href = "index.html";
            return;
          }
          state.user = data.data;
          localStorage.setItem("ff_user", JSON.stringify(state.user));
        }

        // Update user display
        document.getElementById("user-name").textContent = state.user.name;
        document.getElementById("user-role").textContent =
          state.user.role.replace("_", " ");
        document.getElementById("user-avatar").textContent =
          state.user.name[0].toUpperCase();

        // Navigate to dashboard
        navigate("dashboard");
      })();

      async function handleLogout() {
        await api.auth.logout();
        localStorage.removeItem("ff_user");
        window.location.href = "index.html";
      }
    </script>

</html>
