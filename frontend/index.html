<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetFlow — Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .auth-form {
        display: none;
      }
      .auth-form.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="toast-container"></div>

    <div class="auth-page">
      <div class="auth-bg-blob b1"></div>
      <div class="auth-bg-blob b2"></div>

      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-mark">🚛</div>
          <h1>FleetFlow</h1>
          <p>Modular Fleet & Logistics Management</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchTab('login')">
            Sign In
          </button>
          <button class="auth-tab" onclick="switchTab('register')">
            Register
          </button>
        </div>

        <!-- LOGIN FORM -->
        <div class="auth-form active" id="login-form">
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input
                class="form-control"
                type="email"
                id="login-email"
                placeholder="manager@fleetflow.com"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input
                class="form-control"
                type="password"
                id="login-password"
                placeholder="••••••••"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; margin-top: 8px"
              id="login-btn"
            >
              Sign In to FleetFlow
            </button>
          </form>

          <div class="demo-badges">
            <p>Demo Credentials</p>
            <div class="demo-credential">
              <span>Fleet Manager</span>
              <span>manager@fleetflow.com / admin123</span>
            </div>
            <div class="demo-credential">
              <span>Dispatcher</span>
              <span>dispatcher@fleetflow.com / dispatch123</span>
            </div>
            <div style="margin-top: 10px; display: flex; gap: 8px">
              <button
                class="btn btn-sm btn-secondary"
                style="flex: 1"
                onclick="fillDemo('manager')"
              >
                Fill Manager
              </button>
              <button
                class="btn btn-sm btn-secondary"
                style="flex: 1"
                onclick="fillDemo('dispatcher')"
              >
                Fill Dispatcher
              </button>
            </div>
          </div>
        </div>

        <!-- REGISTER FORM -->
        <div class="auth-form" id="register-form">
          <form onsubmit="handleRegister(event)">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input
                class="form-control"
                id="reg-name"
                placeholder="Your name"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input
                class="form-control"
                type="email"
                id="reg-email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input
                class="form-control"
                type="password"
                id="reg-password"
                placeholder="Min 6 characters"
                required
                minlength="6"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Role</label>
              <select class="form-control" id="reg-role">
                <option value="dispatcher">Dispatcher</option>
                <option value="manager">Fleet Manager</option>
                <option value="safety_officer">Safety Officer</option>
                <option value="analyst">Financial Analyst</option>
              </select>
            </div>
            <button
              type="submit"
              class="btn btn-primary"
              style="width: 100%; margin-top: 8px"
            >
              Create Account
            </button>
          </form>
        </div>

        <!-- Theme toggle on login page -->
        <div style="display: flex; justify-content: center; margin-top: 20px">
          <div class="theme-toggle">
            <button
              class="theme-btn active"
              data-theme="dark"
              onclick="applyTheme('dark')"
            >
              🌙
            </button>
            <button
              class="theme-btn"
              data-theme="light"
              onclick="applyTheme('light')"
            >
              ☀️
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      // Apply saved theme
      applyTheme(localStorage.getItem("ff_theme") || "dark");

      function switchTab(tab) {
        document
          .querySelectorAll(".auth-tab")
          .forEach((t, i) =>
            t.classList.toggle(
              "active",
              (i === 0 && tab === "login") || (i === 1 && tab === "register")
            )
          );
        document
          .getElementById("login-form")
          .classList.toggle("active", tab === "login");
        document
          .getElementById("register-form")
          .classList.toggle("active", tab === "register");
      }

      function fillDemo(role) {
        const creds = {
          manager: { email: "manager@fleetflow.com", pass: "admin123" },
          dispatcher: {
            email: "dispatcher@fleetflow.com",
            pass: "dispatch123",
          },
        };
        document.getElementById("login-email").value = creds[role].email;
        document.getElementById("login-password").value = creds[role].pass;
      }

      async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById("login-btn");
        btn.textContent = "Signing in...";
        btn.disabled = true;

        const { ok, data } = await api.auth.login({
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-password").value,
        });

        if (ok) {
          localStorage.setItem("ff_user", JSON.stringify(data.data));
          toast("Welcome back! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } else {
          toast(data.message || "Login failed", "error");
          btn.textContent = "Sign In to FleetFlow";
          btn.disabled = false;
        }
      }

      async function handleRegister(e) {
        e.preventDefault();
        const { ok, data } = await api.auth.register({
          name: document.getElementById("reg-name").value,
          email: document.getElementById("reg-email").value,
          password: document.getElementById("reg-password").value,
          role: document.getElementById("reg-role").value,
        });
        if (ok) {
          toast("Account created! Please sign in.", "success");
          switchTab("login");
        } else toast(data.message, "error");
      }
    </script>
  </body>
</html>
